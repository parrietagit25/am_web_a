services:
  web:
    image: nginx:alpine
    container_name: automarket_web
    ports:
      - "8082:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - automarket-network

  app:
    image: php:8.3-fpm-alpine
    container_name: automarket_app
    # Credenciales n8n: preferir app/config/config.php (no requiere .env).
    # Opcional: exportar N8N_SEMINUEVOS_* en el host o crear .env en la raíz del proyecto.
    volumes:
      - ./app:/var/www/html
      - ./docker/php-fpm-entrypoint.sh:/usr/local/bin/php-fpm-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/php-fpm-entrypoint.sh"]
    networks:
      - automarket-network

networks:
  automarket-network:
    driver: bridge
