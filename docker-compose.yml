services:
  web:
    image: nginx:alpine
    container_name: automarket_web
    ports:
      - "8082:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - automarket-network

  app:
    image: php:8.3-fpm-alpine
    container_name: automarket_app
    volumes:
      - ./app:/var/www/html
    networks:
      - automarket-network

networks:
  automarket-network:
    driver: bridge
