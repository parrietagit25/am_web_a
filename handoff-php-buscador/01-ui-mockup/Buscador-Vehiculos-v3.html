/* Horas cada 15 min (5:00 am - 11:00 pm) */
const HORAS = (() => {
  const list = [];
  for (let h = 5; h <= 23; h++) {
    for (let m = 0; m < 60; m += 15) {
      const period = h < 12 ? 'a.m.' : 'p.m.';
      const h12 = h > 12 ? h - 12 : h === 0 ? 12 : h;
      list.push(`${h12}:${m.toString().padStart(2,'0')} ${period}`);
    }
  }
  return list;
})();

const Icon = ({type,size=16,color='currentColor'}) => {

    user:<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
    search:<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
    tag:<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>,
    star:<svg width={size} height={size} viewBox="0 0 24 24" fill={color} stroke={color} strokeWidth="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,

// Shared field label
function FieldLabel({icon, label}) {
  return (
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
      <span style={{color:'var(--red)'}}><Icon type={icon} size={14}/></span>
      <span style={{fontSize:11,fontWeight:600,color:'var(--gray-500)',textTransform:'uppercase',letterSpacing:'.5px'}}>{label}</span>
    </div>
  );
}

const inputStyle = {
  width:'100%',padding:'10px 14px',borderRadius:10,
  border:'2px solid var(--gray-200)',fontSize:13,color:'var(--navy)',
  background:'#fff',appearance:'none',outline:'none',transition:'border-color .2s',cursor:'pointer'
};

function SelectField({icon,label,value,onChange,options,groups,placeholder}) {
  const [focused,setFocused]=useState(false);
  return (
    <div style={{flex:1,minWidth:0}}>
      <FieldLabel icon={icon} label={label}/>
      <div style={{position:'relative'}}>
        <select value={value} onChange={e=>onChange(e.target.value)}
          onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
          style={{...inputStyle,borderColor:focused?'var(--red)':'var(--gray-200)',
            backgroundImage:`url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E")`,
            backgroundRepeat:'no-repeat',backgroundPosition:'right 12px center',paddingRight:32
          }}>
          <option value="">{placeholder}</option>
          {groups ? groups.map(g => (
            <optgroup key={g.label} label={g.label}>
              {g.items.map(o => <option key={o} value={o}>{o}</option>)}
            </optgroup>
          )) : options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    </div>
  );
}

function DateField({icon,label,value,onChange}) {
  const [focused,setFocused]=useState(false);
  return (
    <div style={{flex:1,minWidth:0}}>
      <FieldLabel icon={icon} label={label}/>
      <input type="date" value={value} onChange={e=>onChange(e.target.value)}
        onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
        style={{...inputStyle,borderColor:focused?'var(--red)':'var(--gray-200)'}}
      />
    </div>
  );
}

// Feature pills for bottom trust bar
function TrustPill({icon,text}) {

      <span style={{fontSize:13,fontWeight:500,color:'var(--gray-600)'}}>{text}</span>

  );
}

/* Build "Promociones" dynamically (any vehicle with promo badges) */
const PROMO_BADGES = new Set(['PROMO','#PrecioEspecial','POPULAR','NUEVO','TOP']);
function buildPromoList() {
  return Object.values(FLOTA).flat().filter(v => PROMO_BADGES.has(v.badge));
}

function FlotaSection() {
  const [activeCat, setActiveCat] = useState('Promociones');
  const cats = ['Promociones', ...Object.keys(FLOTA)];
  const items = activeCat === 'Promociones' ? buildPromoList() : FLOTA[activeCat];

  return (
    <section id="flota" style={{margin:'0 0 56px',scrollMarginTop:24}}>
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',flexWrap:'wrap',gap:16,marginBottom:24}}>
        <div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:2,color:'var(--red)',textTransform:'uppercase',marginBottom:6}}>Nuestra Flota</div>
          <h2 style={{fontSize:32,fontWeight:800,color:'var(--navy)',lineHeight:1.1,letterSpacing:-.5}}>Descubre todos<br/>nuestros vehículos</h2>
        </div>
        <a href="#" style={{color:'var(--red)',fontSize:14,fontWeight:600,textDecoration:'none',display:'inline-flex',alignItems:'center',gap:6}}>
          Ver todas las categorías
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>

      {/* Category tabs */}
      <div style={{display:'flex',gap:8,marginBottom:24,overflowX:'auto',paddingBottom:4}}>
        {cats.map(c => {
          const isActive = activeCat === c;
          return (
            <button key={c} onClick={()=>setActiveCat(c)} style={{
              padding:'10px 22px',borderRadius:24,border:'none',cursor:'pointer',whiteSpace:'nowrap',
              fontSize:14,fontWeight:isActive?700:600,
              background:isActive?'var(--navy)':'#fff',
              color:isActive?'#fff':'var(--gray-600)',
              boxShadow:isActive?'0 4px 14px rgba(26,35,70,.25)':'0 1px 3px rgba(0,0,0,.04)',
              transition:'all .2s',
            }}
            onMouseEnter={e=>{if(!isActive){e.currentTarget.style.background='var(--gray-100)'}}}
            onMouseLeave={e=>{if(!isActive){e.currentTarget.style.background='#fff'}}}>
              {c}
            </button>
          );
        })}
      </div>

      {/* Vehicle grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))',gap:20}}>
        {items.map((v,i) => <FleetCard key={v.name} vehicle={v} index={i}/>)}
      </div>
    </section>
  );
}

// Generic car silhouette placeholder (when image fails)
function CarSilhouette() {
  return (
    <svg viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg" style={{width:'90%',maxWidth:200,position:'relative',zIndex:1,opacity:.45}}>
      <defs>
        <linearGradient id="carbody" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="#9ca3af"/>
          <stop offset="100%" stopColor="#4b5563"/>
        </linearGradient>
      </defs>
      {/* shadow */}
      <ellipse cx="120" cy="98" rx="100" ry="6" fill="rgba(0,0,0,.15)"/>
      {/* body */}
      <path d="M30 75 Q30 60 40 56 L70 50 Q85 30 110 28 L160 28 Q180 30 195 50 L215 56 Q225 60 225 75 L225 88 Q225 92 220 92 L195 92 Q193 100 183 100 Q173 100 171 92 L83 92 Q81 100 71 100 Q61 100 59 92 L35 92 Q30 92 30 88 Z" fill="url(#carbody)"/>
      {/* windows */}
      <path d="M88 50 L108 33 L155 33 L175 50 Z" fill="#1a2346" opacity=".55"/>
      <line x1="130" y1="33" x2="130" y2="50" stroke="rgba(255,255,255,.4)" strokeWidth="1.5"/>
      {/* wheels */}
      <circle cx="71" cy="93" r="11" fill="#1f2937"/>
      <circle cx="71" cy="93" r="5" fill="#d1d5db"/>
      <circle cx="183" cy="93" r="11" fill="#1f2937"/>
      <circle cx="183" cy="93" r="5" fill="#d1d5db"/>
      {/* headlight */}
      <ellipse cx="218" cy="68" rx="4" ry="3" fill="rgba(255,255,255,.6)"/>
    </svg>
  );
}

function FleetCard({vehicle, index}) {
  const [hover, setHover] = useState(false);
  const [imgError, setImgError] = useState(false);
  return (
    <div
      onMouseEnter={()=>setHover(true)}
      onMouseLeave={()=>setHover(false)}
      style={{
        background:'#fff',borderRadius:18,overflow:'hidden',
        boxShadow:hover?'0 12px 36px rgba(26,35,70,.16)':'0 1px 4px rgba(0,0,0,.06)',
        transform:hover?'translateY(-4px)':'none',
        transition:'all .3s cubic-bezier(.2,.8,.2,1)',
        animation:`fadeInUp .4s ease ${index*60}ms forwards`,
        cursor:'pointer',position:'relative',
      }}>
      {/* Badge */}
      {vehicle.badge && (
        <div style={{position:'absolute',top:14,left:14,zIndex:2,
          background:vehicle.badge==='PROMO' || vehicle.badge==='#PrecioEspecial'?'var(--green)':vehicle.badge==='POPULAR'?'var(--navy)':'var(--red)',
          color:'#fff',fontSize:10,fontWeight:700,padding:'4px 11px',borderRadius:20,letterSpacing:.5}}>
          {vehicle.badge}
        </div>
      )}

      {/* Image */}
      <div style={{
        background:'linear-gradient(160deg, #f8fafc 0%, #eef0f5 100%)',
        height:180,display:'flex',alignItems:'center',justifyContent:'center',padding:18,
        position:'relative',overflow:'hidden',
      }}>
        {/* Decorative circle */}
        <div style={{position:'absolute',right:-30,top:-30,width:120,height:120,borderRadius:'50%',background:'rgba(190,28,40,.05)'}}/>
        {imgError || !vehicle.img ? (
          <CarSilhouette/>
        ) : (
          <img src={vehicle.img} alt={vehicle.name}
            onError={()=>setImgError(true)}
            style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',position:'relative',zIndex:1,
              transform:hover?'scale(1.06) translateY(-2px)':'scale(1)',
              transition:'transform .4s cubic-bezier(.2,.8,.2,1)',
              filter:'drop-shadow(0 8px 16px rgba(0,0,0,.12))'}}/>
        )}
      </div>

      {/* Info */}
      <div style={{padding:'18px 20px 20px'}}>
        <div style={{fontSize:17,fontWeight:700,color:'var(--navy)',marginBottom:4,lineHeight:1.2}}>{vehicle.name}</div>
        <div style={{fontSize:12,color:'var(--gray-400)',marginBottom:14}}>o similar</div>

        <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
          {vehicle.specs.map((s,i)=>(
            <span key={i} style={{fontSize:11,fontWeight:600,color:'var(--gray-600)',background:'var(--gray-100)',padding:'3px 9px',borderRadius:6}}>{s}</span>
          ))}
        </div>

        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:10}}>
          <div>
            <div style={{fontSize:10,color:'var(--gray-400)',textTransform:'uppercase',letterSpacing:.5,fontWeight:600,marginBottom:3}}>Desde · USD</div>
            <div style={{fontSize:22,fontWeight:800,color:'var(--navy)',fontVariantNumeric:'tabular-nums',lineHeight:1}}>${vehicle.from.toFixed(2)}<span style={{fontSize:11,fontWeight:500,color:'var(--gray-500)',marginLeft:4}}>/día</span></div>
          </div>
          <button style={{
            background:hover?'var(--red)':'transparent',
            border:`2px solid var(--red)`,color:hover?'#fff':'var(--red)',
            padding:'8px 16px',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer',
            transition:'all .2s',display:'inline-flex',alignItems:'center',gap:5,
          }}>
            Reservar
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════
// REVEAL ON SCROLL — fade-in-up when visible
// ═════════════════════════════════════════
function Reveal({children, delay=0, ...rest}) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(()=>{
    if (!ref.current) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); }});
    }, {threshold: 0.12, rootMargin:'0px 0px -60px 0px'});
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} {...rest} style={{
      ...(rest.style||{}),
      opacity: visible?1:0,
      transform: visible?'translateY(0)':'translateY(28px)',
      transition: `opacity .7s cubic-bezier(.2,.8,.2,1) ${delay}ms, transform .7s cubic-bezier(.2,.8,.2,1) ${delay}ms`,
    }}>
      {children}
    </div>
  );
}

// ═════════════════════════════════════════
// STATS COUNTER BAND — animated numbers
// ═════════════════════════════════════════
function useCountUp(target, duration=1500, trigger=true) {
  const [value, setValue] = useState(0);
  useEffect(()=>{
    if (!trigger) return;
    let raf, start;
    const tick = (ts) => {
      if (!start) start = ts;
      const p = Math.min(1, (ts-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      setValue(Math.round(target * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, trigger]);
  return value;
}

function StatItem({value, suffix='', label, sub, decimal, trigger}) {
  const target = decimal ? Math.round(value*10) : value;
  const v = useCountUp(target, 1600, trigger);
  const display = decimal ? (v/10).toFixed(1) : v.toLocaleString('en-US');
  return (
    <div style={{textAlign:'center'}}>
      <div style={{fontSize:36,fontWeight:800,color:'var(--navy)',letterSpacing:-1,lineHeight:1,marginBottom:6,fontVariantNumeric:'tabular-nums'}}>
        {display}<span style={{color:'var(--red)'}}>{suffix}</span>
      </div>
      <div style={{fontSize:13,fontWeight:600,color:'var(--gray-700)',marginBottom:2}}>{label}</div>
      {sub && <div style={{fontSize:11,color:'var(--gray-400)'}}>{sub}</div>}
    </div>
  );
}

function StatsBand() {
  const ref = useRef(null);
  const [trig, setTrig] = useState(false);
  useEffect(()=>{
    const obs = new IntersectionObserver(([e])=>{if(e.isIntersecting){setTrig(true); obs.disconnect();}}, {threshold:.3});
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{
      background:'#fff',borderRadius:18,padding:'28px 32px',
      boxShadow:'0 4px 24px rgba(26,35,70,.06)',
      margin:'28px 0 40px',

function TestimonioCard({t, index}) {

  const palette = [

  return (

      </svg>
      {/* Stars */}
      <div style={{display:'flex',gap:2}}>

          <svg key={i} width="15" height="15" viewBox="0 0 24 24" fill={i < t.rating ? '#fbbf24' : '#e5e7eb'}>

      <div style={{display:'flex',alignItems:'center',gap:12,marginTop:'auto',paddingTop:14,borderTop:'1px solid var(--gray-100)'}}>

          width:42,height:42,borderRadius:'50%',background:grad,

              {name:'instagram', svg:<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>},
              {name:'facebook', svg:<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>},
              {name:'tiktok', svg:<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005.8 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1.84-.1z"/></svg>},
              {name:'youtube', svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>},
            ].map((s,i)=>(
              <a key={s.name} href="#" onMouseEnter={()=>setHover('s'+i)} onMouseLeave={()=>setHover(null)}
                style={{
                  width:36,height:36,borderRadius:8,
                  background:hover==='s'+i?'var(--red)':'rgba(255,255,255,.08)',
                  display:'flex',alignItems:'center',justifyContent:'center',
                  color:'#fff',textDecoration:'none',transition:'all .2s',
                  transform:hover==='s'+i?'translateY(-2px)':'none',
                }}>
                {s.svg}
              </a>
            ))}
          </div>
        </div>
      </div>

      {/* Bottom band — copyright */}
      <div style={{background:'rgba(0,0,0,.2)'}}>
        <div style={{maxWidth:1200,margin:'0 auto',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div style={{fontSize:11,color:'rgba(255,255,255,.5)'}}>
            © 2026 Panama Car Rental, S.A. · Todos los derechos reservados.
          </div>
          <div style={{fontSize:11,color:'rgba(255,255,255,.4)'}}>
            Sitio web desarrollado por <span style={{color:'rgba(255,255,255,.65)',fontWeight:500}}>Grupo PCR Digital</span>
          </div>
        </div>
      </div>
    </footer>
  );
}

function FooterCol({title, items, more, hover, setHover}) {
  return (
    <div>
      <div style={{fontSize:12,fontWeight:700,color:'#fff',textTransform:'uppercase',letterSpacing:1,marginBottom:16}}>{title}</div>
      <div style={{display:'flex',flexDirection:'column',gap:9}}>
        {items.map(it => (
          <a key={it} href="#" onMouseEnter={()=>setHover(title+it)} onMouseLeave={()=>setHover(null)}
            style={{
              color:hover===title+it?'#fff':'rgba(255,255,255,.55)',
              textDecoration:'none',fontSize:13,fontWeight:500,
              transition:'color .15s',display:'inline-flex',alignItems:'center',gap:6
            }}>
            <span style={{
              width:hover===title+it?10:0,height:1,background:'var(--red)',
              transition:'width .25s'
            }}/>
            {it}
          </a>
        ))}
        {more && (
          <a href="#" style={{color:'var(--red)',fontSize:12,fontWeight:600,textDecoration:'none',marginTop:6,display:'inline-flex',alignItems:'center',gap:5}}>
            {more}
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
        )}
      </div>
    </div>
  );
}

// ═════════════════════════════════════════
// FEATURES — Por qué Automarket (KEPT but UNUSED in JSX)
// ═════════════════════════════════════════
function FeaturesSection() {
  const items = [
    {icon:'map',title:'8 sucursales en Panamá', desc:'Recoge y devuelve donde más te convenga'},
    {icon:'tag',title:'Mejor precio garantizado', desc:'Reservando online obtienes el mejor precio'},
    {icon:'calendar',title:'Cancelación flexible', desc:'Modifica tu reserva sin cargos extra'},
    {icon:'star',title:'Atención 24/7', desc:'Soporte en español por WhatsApp y teléfono'},
  ];
  return (
    <section style={{margin:'0 0 48px',background:'linear-gradient(135deg, var(--navy) 0%, #243366 100%)',borderRadius:20,padding:'40px 32px',position:'relative',overflow:'hidden'}}>
      {/* Decorative shapes */}
      <div style={{position:'absolute',top:-80,right:-60,width:280,height:280,borderRadius:'50%',background:'rgba(190,28,40,.08)'}}/>
      <div style={{position:'absolute',bottom:-100,left:-40,width:240,height:240,borderRadius:'50%',background:'rgba(255,255,255,.03)'}}/>

      <div style={{position:'relative',zIndex:1,marginBottom:28}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:2,color:'#fff',opacity:.6,textTransform:'uppercase',marginBottom:6}}>¿Por qué elegirnos?</div>
        <h2 style={{fontSize:28,fontWeight:800,color:'#fff',lineHeight:1.1,letterSpacing:-.5}}>La experiencia Automarket</h2>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))',gap:16,position:'relative',zIndex:1}}>
        {items.map((it,i)=>(
          <div key={i} style={{background:'rgba(255,255,255,.06)',backdropFilter:'blur(10px)',
            border:'1px solid rgba(255,255,255,.08)',
            borderRadius:14,padding:'20px 22px'}}>
            <div style={{
              width:42,height:42,borderRadius:10,background:'var(--red)',
              display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',marginBottom:14,
              boxShadow:'0 6px 18px rgba(190,28,40,.4)'
            }}>
              <Icon type={it.icon} size={20} color="#fff"/>
            </div>
            <div style={{fontSize:15,fontWeight:700,color:'#fff',marginBottom:6}}>{it.title}</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,.65)',lineHeight:1.5}}>{it.desc}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function App() {
  const [activeTab,setActiveTab]=useState(0);
  const [sucursal,setSucursal]=useState('');
  const [sucursalDev,setSucursalDev]=useState('');
  const [fechaRec,setFechaRec]=useState('2026-04-23');
  const [horaRec,setHoraRec]=useState('10:00 a.m.');
  const [fechaDev,setFechaDev]=useState('2026-04-25');
  const [horaDev,setHoraDev]=useState('10:00 a.m.');
  const [edad,setEdad]=useState('');
  const [devOtra,setDevOtra]=useState(false);
  const [promo,setPromo]=useState(false);
  const [codigoPromo,setCodigoPromo]=useState('');
  const [searching,setSearching]=useState(false);
  const [tweaks,setTweaks]=useState(TWEAK_DEFAULTS);
  const [stickyVisible, setStickyVisible] = useState(false);

  /* Sticky search effect on scroll */
  useEffect(()=>{
    const handleScroll = () => {
      const formEl = document.getElementById('search-form-card');
      if (!formEl) return;
      const rect = formEl.getBoundingClientRect();
      // Show sticky bar when original form is scrolled out of view
      setStickyVisible(rect.bottom < 0);
    };
    window.addEventListener('scroll', handleScroll, {passive:true});
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const handleSearch=()=>{
    setSearching(true);
    setTimeout(()=>{ window.location.href='Seleccion Vehiculos.html'; },700);
  };

  useEffect(()=>{
    const handler=(e)=>{
      if(e.data?.type==='__activate_edit_mode') document.getElementById('tweaks-panel').style.display='block';
      if(e.data?.type==='__deactivate_edit_mode') document.getElementById('tweaks-panel').style.display='none';
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',handler);
  },[]);

  return (
    <div style={{minHeight:'100vh',background:'var(--gray-100)'}}>

      {/* ════ TOP BAR ════ */}
      <TopBar/>

      {/* ════ STICKY SEARCH (aparece al scroll) ════ */}
      <StickySearchBar
        visible={stickyVisible}
        sucursal={sucursal}
        fechaRec={fechaRec} horaRec={horaRec}
        fechaDev={fechaDev} horaDev={horaDev}
        onSearch={handleSearch}
      />

      {/* Service tabs */}
      <div style={{background:'var(--navy)'}}>
        <div style={{maxWidth:1200,margin:'0 auto',display:'flex'}}>
          {TABS.map((t,i)=>(
            <button key={i} onClick={()=>setActiveTab(i)} style={{
              flex:1,padding:'11px 8px',border:'none',cursor:'pointer',fontSize:12,fontWeight:700,
              letterSpacing:'.5px',color:'#fff',transition:'all .2s',
              background: i===activeTab ? t.color : 'transparent',
              borderBottom: i===activeTab ? '3px solid rgba(255,255,255,.3)' : '3px solid transparent',
              opacity: i===activeTab ? 1 : .6,
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* Nav */}
      <div style={{background:'#fff',boxShadow:'0 1px 3px rgba(0,0,0,.06)',padding:'0 24px'}}>
        <div style={{maxWidth:1200,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',height:64}}>
          <div style={{display:'flex',alignItems:'center'}}>
            <img src='assets/logo-automarket.png' alt='Automarket' style={{height:52,objectFit:'contain'}}/>
          </div>
          <NavWithDropdown/>
        </div>
      </div>

      {/* Search form card */}
      <div style={{maxWidth:1200,margin:'0 auto',padding:'32px 24px 0'}}>
        <div id="search-form-card" style={{background:'#fff',borderRadius:20,boxShadow:'0 1px 3px rgba(0,0,0,.06)',overflow:'hidden'}}>

          {/* Card header */}
          <div style={{background:'var(--navy)',padding:'20px 28px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <h2 style={{color:'#fff',fontSize:18,fontWeight:700}}>Reserva tu vehículo</h2>
              <p style={{color:'rgba(255,255,255,.5)',fontSize:13,marginTop:3}}>Completa los datos para ver disponibilidad</p>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,background:'rgba(255,255,255,.1)',padding:'8px 16px',borderRadius:20}}>
              <Icon type="tag" size={14} color="var(--red)"/>
              <span style={{color:'#fff',fontSize:12,fontWeight:600}}>Precio especial web</span>
            </div>
          </div>

          {/* Form body */}
          <div style={{padding:28}}>

            {/* Row 1 */}
            <div style={{display:'grid',gridTemplateColumns:'2fr 1fr .9fr 1fr .9fr 1fr',gap:14,marginBottom:16}}>
              <SelectField icon="map" label="Sucursal de recogida" value={sucursal} onChange={setSucursal} groups={SUCURSALES_GRUPOS} placeholder="Seleccione una sucursal"/>
              <DateField icon="calendar" label="Fecha recogida" value={fechaRec} onChange={setFechaRec}/>
              <SelectField icon="clock" label="Hora" value={horaRec} onChange={setHoraRec} options={HORAS} placeholder="Hora"/>
              <DateField icon="calendar" label="Fecha devolución" value={fechaDev} onChange={setFechaDev}/>
              <SelectField icon="clock" label="Hora" value={horaDev} onChange={setHoraDev} options={HORAS} placeholder="Hora"/>
              <SelectField icon="user" label="Edad conductor" value={edad} onChange={setEdad} options={EDADES} placeholder="Seleccione"/>
            </div>

            {/* Row 2: extra sucursal */}
            {devOtra && (
              <div style={{marginBottom:16,maxWidth:400,animation:'fadeInUp .3s ease'}}>
                <SelectField icon="map" label="Sucursal de devolución" value={sucursalDev} onChange={setSucursalDev} groups={SUCURSALES_GRUPOS} placeholder="Seleccione sucursal de devolución"/>
              </div>
            )}

            {/* Row 3: checkboxes + promo + button */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12,paddingTop:16,borderTop:'1px solid var(--gray-100)'}}>
              <div style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'center'}}>
                {[
                  {label:'Devolver el auto en otra sucursal', val:devOtra, set:setDevOtra},
                  {label:'¿Tienes un código promocional?', val:promo, set:setPromo},
                ].map(({label,val,set},i)=>(
                  <label key={i} style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--gray-600)',cursor:'pointer',userSelect:'none'}}>
                    <div onClick={()=>set(!val)} style={{
                      width:18,height:18,borderRadius:5,border:`2px solid ${val?'var(--red)':'var(--gray-300)'}`,
                      background: val?'var(--red)':'#fff',
                      display:'flex',alignItems:'center',justifyContent:'center',
                      transition:'all .15s',cursor:'pointer',flexShrink:0
                    }}>
                      {val && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                    </div>
                    {label}
                  </label>
                ))}
                {promo && (
                  <input type="text" placeholder="Ingresa tu código" value={codigoPromo} onChange={e=>setCodigoPromo(e.target.value)}
                    style={{...inputStyle,width:180,padding:'8px 12px',borderColor:'var(--gray-200)'}}
                  />
                )}
              </div>

              <button onClick={handleSearch} disabled={searching} style={{
                padding:'12px 36px',borderRadius:12,border:'none',
                background: searching?'var(--gray-400)':'var(--red)',
                color:'#fff',fontSize:14,fontWeight:700,cursor:searching?'wait':'pointer',
                display:'flex',alignItems:'center',gap:8,flexShrink:0,
                boxShadow:'0 4px 16px rgba(190,28,40,.3)',
                transition:'all .2s',transform:searching?'scale(.97)':'scale(1)'
              }}
              onMouseEnter={e=>{if(!searching){e.currentTarget.style.background='var(--red-dark)';e.currentTarget.style.boxShadow='0 6px 20px rgba(190,28,40,.4)';}}}
              onMouseLeave={e=>{e.currentTarget.style.background=searching?'var(--gray-400)':'var(--red)';e.currentTarget.style.boxShadow='0 4px 16px rgba(190,28,40,.3)';}}>
                {searching
                  ? <><span style={{width:16,height:16,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .6s linear infinite'}}/>Buscando...</>
                  : <><Icon type="search" size={16} color="#fff"/>Buscar vehículos</>
                }
              </button>
            </div>
          </div>
        </div>

        {/* ════ HERO BANNER ════ */}
        <Reveal><HeroBanner/></Reveal>

        {/* ════ STATS COUNTER ════ */}
        <Reveal delay={80}><StatsBand/></Reveal>

        {/* ════ FLOTA ════ */}
        <Reveal><FlotaSection/></Reveal>

        {/* ════ BLOG DESTACADO ════ */}
        <Reveal><BlogDestacado/></Reveal>

        {/* ════ PROMOS ════ */}
        <Reveal><PromosSection/></Reveal>

        {/* ════ TESTIMONIOS ════ */}
        <Reveal><TestimoniosSection/></Reveal>

        {/* ════ POR QUÉ AUTOMARKET ════ */}
        {/* Removed — el footer cubre esto */}
      </div>

      {/* ════ FOOTER ════ */}
      <Footer/>

      {/* WhatsApp floating button */}
      <WhatsAppButton/>

      {/* Tweaks */}
      <div id="tweaks-panel" style={{display:'none',position:'fixed',bottom:20,right:20,width:260,background:'#fff',borderRadius:16,boxShadow:'0 8px 40px rgba(0,0,0,.15)',padding:20,zIndex:999}}>
        <h4 style={{fontSize:14,fontWeight:700,marginBottom:12,color:'var(--navy)'}}>Tweaks</h4>
        <label style={{fontSize:12,color:'var(--gray-500)',display:'block',marginBottom:6}}>Color de acento</label>
        <div style={{display:'flex',gap:8}}>
          {['#c41e2a','#1a1a2e','#2563eb','#7c3aed','#059669'].map(c=>(
            <div key={c} onClick={()=>{
              setTweaks(t=>({...t,accentColor:c}));
              document.documentElement.style.setProperty('--red',c);
              window.parent.postMessage({type:'__edit_mode_set_keys',edits:{accentColor:c}},'*');
            }} style={{
              width:30,height:30,borderRadius:8,background:c,cursor:'pointer',
              border: tweaks.accentColor===c?'3px solid var(--navy)':'3px solid transparent',
              outline: tweaks.accentColor===c?'2px solid #fff':'none',
              transition:'all .15s'
            }}/>
          ))}
        </div>
      </div>

      <style>{`@keyframes spin{to{transform:rotate(360deg)}} @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
