server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Landing pages independientes: /l/mi-slug
    location ~ ^/l/([a-zA-Z0-9-]+)/?$ {
        rewrite ^/l/([a-zA-Z0-9-]+)/?$ /landing.php?slug=$1 last;
    }

    # Fichas de sucursal: /sucursal/{slug}
    location ~ ^/sucursal/([a-zA-Z0-9-]+)/?$ {
        rewrite ^/sucursal/([a-zA-Z0-9-]+)/?$ /sucursal.php?slug=$1 last;
    }

    # Fichas de vehículo: /autos/{seo-slug}/{placa-slug} → detalle.php (placa es la fuente real)
    # IMPORTANTE: la regla id() debe ir ANTES que la de placa (nginx usa la primera regex que coincide).
    # /autos/ford-2020/id99 → detalle.php?id=99
    location ~ ^/autos/[^/]+/id([0-9]+)/?$ {
        rewrite ^/autos/[^/]+/id([0-9]+)/?$ /detalle.php?id=$1 last;
    }

    # /autos/toyota-hilux-2025/eo6583 → detalle.php?placa=eo6583
    # Excluye segmentos id{digits} para no capturarlos como placa.
    location ~ ^/autos/[^/]+/(?!id[0-9]+/?$)([^/]+)/?$ {
        rewrite ^/autos/[^/]+/(?!id[0-9]+/?$)([^/]+)/?$ /detalle.php?placa=$1 last;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/api/ {
        root /var/www/html;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
